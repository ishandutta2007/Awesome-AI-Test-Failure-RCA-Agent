<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pill-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)" />
      <stop offset="100%" stop-color="rgba(129, 140, 248, 0.1)" />
    </linearGradient>

    <linearGradient id="grid-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="circuit-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="0" cy="0" r="1.5" fill="rgba(56, 189, 248, 0.2)" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-18px) scale(1.04); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.75; }
      }
      @keyframes flowData {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes scanline {
        0% { transform: translateY(-100px); }
        100% { transform: translateY(450px); }
      }
      .anim-float { animation: floatSlow 7s ease-in-out infinite; }
      .anim-pulse { animation: pulseGlow 4s ease-in-out infinite; }
      .anim-flow { stroke-dasharray: 12, 12; animation: flowData 10s linear infinite; }
      .anim-flow-reverse { stroke-dasharray: 8, 8; animation: flowData 7s linear infinite reverse; }
      .anim-radar { transform-origin: 1040px 140px; animation: radarSweep 12s linear infinite; }
      .anim-scan { animation: scanline 8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="420" fill="url(#circuit-grid)" rx="16" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow-cyan)" class="anim-pulse" />
  <circle cx="1060" cy="180" r="170" fill="#818cf8" opacity="0.15" filter="url(#glow-purple)" class="anim-float" />
  <circle cx="650" cy="380" r="160" fill="#c084fc" opacity="0.1" filter="url(#glow-purple)" class="anim-pulse" />

  <!-- Animated Background Diagnostic Grid / Network Nodes (placed behind text) -->
  <g opacity="0.45">
    <!-- Connecting neural lines -->
    <path d="M 120 340 Q 320 280 500 350 T 880 320 T 1120 260" fill="none" stroke="#38bdf8" stroke-width="2" class="anim-flow" />
    <path d="M 80 180 Q 400 90 700 160 T 1140 100" fill="none" stroke="#a855f7" stroke-width="1.5" class="anim-flow-reverse" />

    <!-- Right-hand Interactive Diagnostic Target & Radar -->
    <circle cx="1040" cy="140" r="65" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4, 4" />
    <circle cx="1040" cy="140" r="95" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.5" />
    <circle cx="1040" cy="140" r="125" fill="none" stroke="#c084fc" stroke-width="0.7" opacity="0.3" />
    
    <g class="anim-radar">
      <line x1="1040" y1="140" x2="1165" y2="140" stroke="url(#primary-grad)" stroke-width="2" />
    </g>
    
    <!-- Pulse nodes -->
    <circle cx="985" cy="110" r="5" fill="#38bdf8" />
    <circle cx="1090" cy="175" r="4" fill="#f43f5e" />
    <circle cx="1030" cy="205" r="4.5" fill="#10b981" />
  </g>

  <!-- Foreground Title, Badges & Subtitles -->
  <!-- Tagline Badge -->
  <g transform="translate(80, 52)">
    <rect width="270" height="32" rx="16" fill="url(#pill-accent)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#10b981" />
    <text x="30" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">CURATED QUALITY INTELLIGENCE</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="145" fill="url(#primary-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.8">Awesome AI Test Failure RCA Agent</text>

  <!-- Subtitle -->
  <text x="80" y="195" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">Autonomous Root Cause Analysis, Flaky Test Detection &amp; Test Intelligence</text>

  <!-- Description Line -->
  <text x="80" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
    Curated SaaS platforms, self-hosted LLM diagnostics, and open-source autonomous agents for CI/CD pipelines
  </text>

  <!-- Dynamic Feature Badges / Pills in Foreground -->
  <g transform="translate(80, 275)">
    <!-- Pill 1: Automated RCA -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
      <text x="20" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">⚡ Autonomous RCA</text>
    </g>

    <!-- Pill 2: Flaky Test Intelligence -->
    <g transform="translate(195, 0)">
      <rect width="195" height="42" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.2" />
      <text x="20" y="26" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">🔬 Flaky Test Detection</text>
    </g>

    <!-- Pill 3: CI/CD Pipeline Healers -->
    <g transform="translate(405, 0)">
      <rect width="190" height="42" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.2" />
      <text x="20" y="26" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">🤖 CI/CD Healers</text>
    </g>

    <!-- Pill 4: Open Source & Enterprise SaaS -->
    <g transform="translate(610, 0)">
      <rect width="210" height="42" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.2" />
      <text x="20" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">📦 Open Source &amp; SaaS</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primary-grad)" />
</svg>